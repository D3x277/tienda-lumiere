<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumiere</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <meta name="theme-color" content="#F8EEF1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&display=swap">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/store.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <button class="menu-btn" id="menu-btn" type="button" aria-haspopup="dialog" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" id="brand" href="#/"></a>
      <button class="cart-btn" id="cart-btn" type="button" aria-haspopup="dialog">
        <span class="cart-ico" aria-hidden="true"></span>
        <span class="cart-label">Mi carrito</span>
        <span class="count" id="cart-count" aria-hidden="true">0</span>
        <span class="sr-only" id="cart-count-sr"></span>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"><p class="wrap loading">Cargando la tienda…</p></main>

  <footer class="site-footer" id="footer"></footer>

  <a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" hidden>
    <span class="wa-ico" aria-hidden="true"></span>
    <span class="wa-label">Pide por WhatsApp</span>
  </a>

  <dialog class="menu" id="menu" aria-label="Menú"></dialog>
  <dialog class="drawer" id="cart" aria-labelledby="cart-title"></dialog>

  <script src="/dom.js"></script>
  <script src="/store.js"></script>
</body>
</html>
